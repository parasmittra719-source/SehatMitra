<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SehatMitra | Offline AI Health Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <div class="logo">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <div>
                    <h1>SehatMitra</h1>
                    <p class="subtitle">Offline AI Health Companion</p>
                </div>
            </div>
            <div class="header-right">
                <div class="status-badge offline" id="connection-status">
                    <i class="fa-solid fa-wifi"></i> Offline-First
                </div>
                <select id="language-select" class="lang-select">
                    <option value="hi">हिंदी (Hindi)</option>
                    <option value="en">English</option>
                </select>
            </div>
        </header>

        <div class="chat-container" id="chat-container">
            <div class="welcome-message">
                <h2>Hello! I'm SehatMitra.</h2>
                <p>I am your local health assistant powered by Gemma 4. How can I help you today?</p>
                <div class="suggestion-chips">
                    <button class="chip" onclick="setQuery('मुझे बुखार और सर दर्द है')">🤒 बुखार और सर दर्द</button>
                    <button class="chip" onclick="setQuery('I have a stomach ache')">🤢 Stomach Ache</button>
                    <button class="chip" onclick="setQuery('First aid for burns')">🩹 First aid for burns</button>
                </div>
            </div>
            <!-- Chat messages will be injected here -->
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <button class="icon-btn" id="voice-btn" title="Voice Input (Mock)"><i class="fa-solid fa-microphone"></i></button>
                <button class="icon-btn" id="image-btn" title="Image Input (Mock)"><i class="fa-solid fa-camera"></i></button>
                <textarea id="query-input" placeholder="टाइप करें या बोलें... (Type your symptoms...)" rows="1"></textarea>
                <button class="send-btn" id="send-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>पूछें (Ask)</span>
                </button>
            </div>
            <div class="emergency-footer">
                <button class="emergency-btn"><i class="fa-solid fa-truck-medical"></i> Emergency Info</button>
                <p class="disclaimer">SehatMitra provides general info, not a replacement for a real doctor.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
